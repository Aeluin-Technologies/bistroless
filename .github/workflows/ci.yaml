name: OCI CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: oci-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test OCI images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: images/dagster/uv.lock

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Validate uv lockfile
        run: uv lock --check --project images/dagster

      - name: Build multi-architecture image
        run: bazel build --nostamp //images/dagster:image

      - name: Load AMD64 image
        run: bazel run --nostamp //images/dagster:image_load_amd64

      - name: Test AMD64 image
        run: |
          build/ci/smoke_image.sh \
            linux/amd64 \
            local/bristroless-python:amd64 \
            3000

      - name: Load ARM64 image
        run: bazel run --nostamp //images/dagster:image_load_arm64

      - name: Test ARM64 image
        run: |
          build/ci/smoke_image.sh \
            linux/arm64 \
            local/bristroless-python:arm64 \
            3001
